<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <span class="title">PROMPTIFY V2.4.1</span>
      <div class="header-icons">
        <span id="settingsBtn" class="icon-btn">⚙️</span>
        <span id="closeBtn" class="icon-btn">✕</span>
      </div>
    </header>

    <!-- MAIN VIEW -->
    <main id="mainView">
      <div id="inputCard" class="card card-white">
        <div class="card-header">
          <label>CURRENT INPUT</label>
          <button id="optimizeBtn" class="action-btn" title="Optimize Prompt">🔄</button>
        </div>
        <div class="value-container">
          <span id="currentInputCount" class="value">0</span>
          <span class="unit">WDS</span>
        </div>
        <div id="savingsContainer" class="savings-badge" style="display: none;">
          Saved <span id="savedTokens">0</span> tokens
        </div>
        <img id="successGif" src="../dancing plants.gif" class="success-gif" alt="">
      </div>

      <div id="contextCard" class="card card-white">
        <div class="card-header">
          <label>CONTEXT MEMORY</label>
          <button id="newChatBtn" class="action-btn" title="Start in New Chat" style="display: none;">↗️</button>
        </div>
        <div class="value-container">
          <span id="contextMemoryCount" class="value">0</span>
          <span class="unit">WDS</span>
        </div>
      </div>
    </main>

    <!-- SETTINGS VIEW -->
    <main id="settingsView" style="display: none;">
      <div class="settings-group">
        <h3>INPUT THRESHOLDS</h3>
        <div class="input-row">
          <label>Yellow at</label>
          <input type="number" id="inputYellow" value="501">
        </div>
        <div class="input-row">
          <label>Red at</label>
          <input type="number" id="inputRed" value="1001">
        </div>
      </div>

      <div class="settings-group">
        <h3>CONTEXT THRESHOLDS</h3>
        <div class="input-row">
          <label>Yellow at</label>
          <input type="number" id="contextYellow" value="5001">
        </div>
        <div class="input-row">
          <label>Red at</label>
          <input type="number" id="contextRed" value="30001">
        </div>
      </div>

      <button id="saveSettingsBtn" class="primary-btn">SAVE & BACK</button>
    </main>

    <footer>
      <div class="status-indicator">
        <span class="dot"></span>
        <span id="statusText">ACCESS GRANTED</span>
      </div>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
