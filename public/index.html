<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COP-X | AI Prompt Optimizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #10b981;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #818cf8, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-dim);
            font-size: 1.1rem;
        }

        main {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            animation: fadeInUp 0.8s ease-out;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            border-color: rgba(99, 102, 241, 0.4);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .label {
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .stats {
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: 600;
        }

        textarea {
            width: 100%;
            height: 400px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1rem;
            color: var(--text);
            font-size: 0.95rem;
            line-height: 1.6;
            resize: none;
            outline: none;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        .actions {
            grid-column: span 2;
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }

        button {
            padding: 1rem 2.5rem;
            border-radius: 9999px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.39);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--glass);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .loading {
            display: none;
            margin-top: 2rem;
            font-weight: 600;
            color: var(--primary);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
            }
            .actions {
                grid-column: span 1;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>COP-X</h1>
        <p class="subtitle">Next-gen Prompt Compression & Context Bootstrapping</p>
    </header>

    <main>
        <div class="card">
            <div class="card-header">
                <span class="label">Input Text</span>
                <span id="input-stats" class="stats">0 tokens</span>
            </div>
            <textarea id="input-text" placeholder="Paste your long prompt or conversation history here..."></textarea>
        </div>

        <div class="card">
            <div class="card-header">
                <span class="label">Optimized Output</span>
                <span id="output-stats" class="stats">0 tokens</span>
            </div>
            <textarea id="output-text" readonly placeholder="Result will appear here..."></textarea>
        </div>

        <div class="actions">
            <button id="btn-shorten" class="btn-primary">
                Shorten Prompt
            </button>
            <button id="btn-summarize" class="btn-secondary">
                Summarize Conversation
            </button>
        </div>

        <div id="loading" class="loading">Processing with AI...</div>
    </main>

    <script>
        const inputText = document.getElementById('input-text');
        const outputText = document.getElementById('output-text');
        const btnShorten = document.getElementById('btn-shorten');
        const btnSummarize = document.getElementById('btn-summarize');
        const inputStats = document.getElementById('input-stats');
        const outputStats = document.getElementById('output-stats');
        const loading = document.getElementById('loading');

        function estimateTokens(text) {
            return Math.ceil(text.length / 4);
        }

        inputText.addEventListener('input', () => {
            const tokens = estimateTokens(inputText.value);
            inputStats.textContent = `${tokens} tokens`;
        });

        async function process(endpoint) {
            if (!inputText.value.trim()) return;

            loading.style.display = 'block';
            btnShorten.disabled = true;
            btnSummarize.disabled = true;
            outputText.value = 'Processing...';

            try {
                const response = await fetch(`/api/${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: inputText.value })
                });

                const data = await response.json();
                
                if (data.error) throw new Error(data.error);

                outputText.value = data.optimizedText || data.summaryText;
                outputStats.textContent = `${data.optimizedTokens} tokens (${((data.optimizedTokens / data.originalTokens) * 100).toFixed(1)}%)`;
                
            } catch (err) {
                outputText.value = `Error: ${err.message}`;
            } finally {
                loading.style.display = 'none';
                btnShorten.disabled = false;
                btnSummarize.disabled = false;
            }
        }

        btnShorten.addEventListener('click', () => process('shorten'));
        btnSummarize.addEventListener('click', () => process('summarize'));
    </script>
</body>
</html>
